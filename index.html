<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111; color: #eee; font-family: sans-serif; }
  canvas { background: #1b1b1b; border: 2px solid #444; max-width: 95vw; }
  #score { margin: 12px 0; font-size: 20px; }
  p { color: #888; font-size: 14px; }
</style>
</head>
<body>
<div id="score">Score: 0</div>
<canvas id="c" width="400" height="400"></canvas>
<p>Arrow keys / WASD or swipe to move. Space to restart.</p>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const size = 20, cells = canvas.width / size;
let snake, dir, nextDir, food, score, alive, timer;

function reset() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = nextDir = {x: 1, y: 0};
  score = 0;
  alive = true;
  placeFood();
  scoreEl.textContent = 'Score: 0';
  clearInterval(timer);
  timer = setInterval(step, 110);
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function step() {
  if (!alive) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.y < 0 || head.x >= cells || head.y >= cells ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    alive = false;
    draw();
    return;
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = 'Score: ' + score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#e74c3c';
  ctx.fillRect(food.x * size + 2, food.y * size + 2, size - 4, size - 4);
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#2ecc71' : '#27ae60';
    ctx.fillRect(s.x * size + 1, s.y * size + 1, size - 2, size - 2);
  });
  if (!alive) {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Game over', canvas.width / 2, canvas.height / 2 - 6);
    ctx.font = '16px sans-serif';
    ctx.fillText('Press Space to restart', canvas.width / 2, canvas.height / 2 + 22);
  }
}

function turn(x, y) {
  if (x === -dir.x && y === -dir.y) return;
  nextDir = {x, y};
}

const keys = {
  ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1],
  ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0],
};
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!alive) reset(); return; }
  const k = keys[e.key];
  if (k) { e.preventDefault(); turn(...k); }
});

let t0;
canvas.addEventListener('touchstart', e => { t0 = e.touches[0]; if (!alive) reset(); }, {passive: true});
canvas.addEventListener('touchend', e => {
  if (!t0) return;
  const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
  if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
});

reset();
draw();
</script>
</body>
</html>
